<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>流浪星球 - 发现TA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rangeslider.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-center">
            <h1 class="logo">🪐 流浪星球</h1>
        </div>
        <button class="filter-btn" id="openFilter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="18" x2="20" y2="18"/>
                <circle cx="8" cy="6" r="2" fill="currentColor"/>
                <circle cx="16" cy="12" r="2" fill="currentColor"/>
                <circle cx="12" cy="18" r="2" fill="currentColor"/>
            </svg>
            筛选
        </button>
    </header>

    <!-- 统计栏 -->
    <div class="stats-bar">
        <span id="totalCount">共 0 位嘉宾</span>
    </div>

    <!-- 嘉宾列表 -->
    <main class="guest-list" id="guestList">
        <div class="cards-container" id="cardsContainer"></div>
        
        <!-- 加载状态 -->
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">💔</div>
            <p>要求太严格<br>可不太好脱单哦</p>
        </div>
    </main>

    <!-- 筛选弹窗 -->
    <div class="filter-modal" id="filterModal">
        <div class="filter-modal-header">
            <span class="filter-modal-title">筛选条件</span>
            <button class="filter-modal-close" id="closeFilter">×</button>
        </div>
        
        <!-- 分组Tab -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-group="basic">基本信息</button>
            <button class="filter-tab" data-group="finance">经济情况</button>
        </div>
        
        <div class="filter-modal-body">
            <!-- 基本信息 -->
            <div class="filter-group" id="group-basic">
                <!-- 性别 -->
                <div class="filter-item">
                    <label>性别</label>
                    <div class="filter-options">
                        <button class="filter-chip active" data-field="性别" data-value="">全部</button>
                        <button class="filter-chip" data-field="性别" data-value="男">男生</button>
                        <button class="filter-chip" data-field="性别" data-value="女">女生</button>
                    </div>
                </div>

                <!-- 年龄 - 滑块 -->
                <div class="filter-item">
                    <label>年龄范围</label>
                    <div class="slider-container">
                        <div class="slider-track">
                            <div class="slider-fill" id="ageFill"></div>
                        </div>
                        <input type="range" class="range-slider" id="ageMin" min="18" max="50" value="18" data-field="年龄">
                        <input type="range" class="range-slider" id="ageMax" min="18" max="50" value="50" data-field="年龄">
                        <div class="slider-values">
                            <span id="ageMinValue">18岁</span>
                            <span id="ageMaxValue">50岁</span>
                        </div>
                    </div>
                </div>

                <!-- 身高 - 滑块 -->
                <div class="filter-item">
                    <label>身高范围</label>
                    <div class="slider-container">
                        <div class="slider-track">
                            <div class="slider-fill" id="heightFill"></div>
                        </div>
                        <input type="range" class="range-slider" id="heightMin" min="150" max="190" value="150" data-field="身高">
                        <input type="range" class="range-slider" id="heightMax" min="150" max="190" value="190" data-field="身高">
                        <div class="slider-values">
                            <span id="heightMinValue">不限</span>
                            <span id="heightMaxValue">不限</span>
                        </div>
                    </div>
                </div>

                <!-- 学历 -->
                <div class="filter-item">
                    <label>学历（可多选）</label>
                    <div class="filter-options multi-select">
                        <button class="filter-chip" data-field="学历" data-value="大专">大专</button>
                        <button class="filter-chip" data-field="学历" data-value="本科">本科</button>
                        <button class="filter-chip" data-field="学历" data-value="硕士">硕士</button>
                        <button class="filter-chip" data-field="学历" data-value="博士">博士</button>
                    </div>
                </div>

                <!-- 婚姻状态 -->
                <div class="filter-item">
                    <label>婚姻状态（可多选）</label>
                    <div class="filter-options multi-select">
                        <button class="filter-chip" data-field="婚姻状态" data-value="未婚">未婚</button>
                        <button class="filter-chip" data-field="婚姻状态" data-value="离异 · 不带娃">离异 · 不带娃</button>
                        <button class="filter-chip" data-field="婚姻状态" data-value="离异 · 带娃">离异 · 带娃</button>
                        <button class="filter-chip" data-field="婚姻状态" data-value="丧偶">丧偶</button>
                    </div>
                </div>
            </div>

            <!-- 经济情况 -->
            <div class="filter-group" id="group-finance" style="display:none;">
                <!-- 年收入 -->
                <div class="filter-item">
                    <label>年收入（可多选）</label>
                    <div class="filter-options multi-select">
                        <button class="filter-chip" data-field="年收入" data-value="10万以下">10万以下</button>
                        <button class="filter-chip" data-field="年收入" data-value="10-20万">10-20万</button>
                        <button class="filter-chip" data-field="年收入" data-value="20-30万">20-30万</button>
                        <button class="filter-chip" data-field="年收入" data-value="30-50万">30-50万</button>
                        <button class="filter-chip" data-field="年收入" data-value="50万以上">50万以上</button>
                    </div>
                </div>

                <!-- 房产情况 - 精确匹配截图 -->
                <div class="filter-item">
                    <label>房产情况（可多选）</label>
                    <div class="filter-options multi-select">
                        <button class="filter-chip" data-field="房产情况" data-value="有房 · 无贷">有房 · 无贷</button>
                        <button class="filter-chip" data-field="房产情况" data-value="有房 · 有贷">有房 · 有贷</button>
                        <button class="filter-chip" data-field="房产情况" data-value="无房 · 计划购房">无房 · 计划购房</button>
                        <button class="filter-chip" data-field="房产情况" data-value="无房 · 暂不考虑购房">无房 · 暂不考虑购房</button>
                        <button class="filter-chip" data-field="房产情况" data-value="无房，期望双方共同购买">无房，期望双方共同购买</button>
                        <button class="filter-chip" data-field="房产情况" data-value="与父母同住">与父母同住</button>
                    </div>
                </div>

                <!-- 车产情况 - 精确匹配截图 -->
                <div class="filter-item">
                    <label>车产情况（可多选）</label>
                    <div class="filter-options multi-select">
                        <button class="filter-chip" data-field="车产情况" data-value="有车">有车</button>
                        <button class="filter-chip" data-field="车产情况" data-value="无车 · 计划购车">无车 · 计划购车</button>
                        <button class="filter-chip" data-field="车产情况" data-value="无车 · 暂不考虑购车">无车 · 暂不考虑购车</button>
                    </div>
                </div>
            </div>

        </div>

        <div class="filter-modal-footer">
            <button class="btn-reset" id="resetFilter">重置</button>
            <button class="btn-confirm" id="confirmFilter">确定</button>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div class="mask" id="mask"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
